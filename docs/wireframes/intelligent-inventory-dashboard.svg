<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1140" role="img" aria-labelledby="title description">
  <title id="title">Intelligent Inventory Dashboard low-fidelity wireframe</title>
  <desc id="description">A dashboard header with refresh controls, inventory filters, and a vehicle table. An aging vehicle has a proposed-action form; a 90-day vehicle has no action control.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #242424; }
      .muted { fill: #686868; }
      .small { font-size: 13px; }
      .label { font-size: 14px; font-weight: 600; }
      .body { font-size: 15px; }
      .heading { font-size: 25px; font-weight: 700; }
      .border { fill: #fff; stroke: #999; stroke-width: 1.5; }
      .soft { fill: #f4f4f4; stroke: #999; stroke-width: 1.5; }
      .button { fill: #fff; stroke: #555; stroke-width: 1.5; }
      .accent { fill: #fff1e9; stroke: #e4b79d; stroke-width: 1.5; }
      .table-line { stroke: #c7c7c7; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1440" height="1000" fill="#fafafa"/>
  <rect x="48" y="36" width="1344" height="112" rx="8" class="border"/>
  <text x="80" y="82" class="heading">Intelligent Inventory</text>
  <text x="80" y="112" class="body muted">Dealership vehicle overview</text>
  <text x="1040" y="78" class="small muted">Last refreshed</text>
  <text x="1040" y="103" class="body">Today, 10:42 AM</text>
  <rect x="1238" y="65" width="120" height="46" rx="6" class="button"/>
  <text x="1298" y="94" text-anchor="middle" class="label">Refresh</text>

  <rect x="48" y="174" width="432" height="108" rx="8" class="border"/>
  <text x="72" y="211" class="small label">TOTAL VEHICLES</text>
  <text x="72" y="254" class="heading">200</text>
  <text x="180" y="211" class="small muted">Should</text>
  <rect x="504" y="174" width="432" height="108" rx="8" class="accent"/>
  <text x="528" y="211" class="small label">AGING STOCK (&gt;90 DAYS)</text>
  <text x="528" y="254" class="heading">90</text>
  <rect x="960" y="174" width="432" height="108" rx="8" class="border"/>
  <text x="984" y="211" class="small label">AGING VEHICLES WITH AN ACTION</text>
  <text x="984" y="254" class="heading">0</text>

  <rect x="48" y="306" width="1344" height="184" rx="8" class="border"/>
  <text x="80" y="343" class="label">Filters</text>
  <rect x="1214" y="319" width="146" height="40" rx="5" class="button"/>
  <text x="1287" y="344" text-anchor="middle" class="small label">Reset filters</text>
  <text x="80" y="378" class="small muted">Search</text>
  <rect x="80" y="390" width="380" height="48" rx="5" class="border"/>
  <text x="98" y="420" class="body muted">Stock number, make or model</text>
  <text x="484" y="378" class="small muted">Make</text>
  <rect x="484" y="390" width="190" height="48" rx="5" class="border"/>
  <text x="502" y="420" class="body">All makes</text>
  <text x="698" y="378" class="small muted">Model</text>
  <rect x="698" y="390" width="190" height="48" rx="5" class="border"/>
  <text x="716" y="420" class="body">All models</text>
  <text x="912" y="378" class="small muted">Age band</text>
  <rect x="912" y="390" width="190" height="48" rx="5" class="border"/>
  <text x="930" y="420" class="body">All age bands</text>
  <rect x="1126" y="402" width="20" height="20" rx="3" class="border"/>
  <text x="1158" y="418" class="body">Aging only</text>
  <text x="80" y="466" class="small muted">Filters combine; Reset filters clears all active criteria.</text>

  <rect x="48" y="516" width="1344" height="558" rx="8" class="border"/>
  <text x="80" y="557" class="heading">Inventory</text>
  <text x="80" y="583" class="small muted">Vehicle stock and current proposed action</text>

  <rect x="72" y="608" width="1296" height="52" fill="#eeeeee"/>
  <text x="88" y="640" class="small label">STOCK NO.</text>
  <text x="230" y="640" class="small label">MAKE</text>
  <text x="350" y="640" class="small label">MODEL</text>
  <text x="490" y="640" class="small label">ENTRY DATE</text>
  <text x="650" y="640" class="small label">DAYS</text>
  <text x="740" y="640" class="small label">STATUS</text>
  <text x="890" y="640" class="small label">CURRENT ACTION / PROPOSED ACTION</text>
  <line x1="72" y1="660" x2="1368" y2="660" class="table-line"/>

  <text x="88" y="697" class="body">STK-0001</text>
  <text x="230" y="697" class="body">Toyota</text>
  <text x="350" y="697" class="body">Camry</text>
  <text x="490" y="697" class="body">2026-07-11</text>
  <text x="650" y="697" class="body">89</text>
  <text x="740" y="697" class="body muted">—</text>
  <text x="890" y="697" class="body muted">No action</text>
  <line x1="72" y1="718" x2="1368" y2="718" class="table-line"/>

  <text x="88" y="756" class="body">STK-0002</text>
  <text x="230" y="756" class="body">Honda</text>
  <text x="350" y="756" class="body">Civic</text>
  <text x="490" y="756" class="body">2026-07-10</text>
  <text x="650" y="756" class="body">90</text>
  <text x="740" y="756" class="body muted">—</text>
  <text x="890" y="756" class="body muted">No action control at 90 days</text>
  <line x1="72" y1="777" x2="1368" y2="777" class="table-line"/>

  <text x="88" y="815" class="body">STK-0003</text>
  <text x="230" y="815" class="body">Ford</text>
  <text x="350" y="815" class="body">Escape</text>
  <text x="490" y="815" class="body">2026-07-09</text>
  <text x="650" y="815" class="body">91</text>
  <rect x="740" y="792" width="82" height="32" rx="16" class="soft"/>
  <text x="781" y="813" text-anchor="middle" class="small label">Aging</text>
  <text x="890" y="815" class="body muted">No saved action</text>
  <line x1="72" y1="836" x2="1368" y2="836" class="table-line"/>

  <rect x="860" y="856" width="484" height="190" rx="6" class="soft"/>
  <text x="884" y="886" class="label">Propose an action for STK-0003</text>
  <text x="884" y="915" class="small muted">Action</text>
  <rect x="884" y="926" width="430" height="40" rx="4" class="border"/>
  <text x="898" y="951" class="small">Select action (example: Price Reduction Planned)</text>
  <text x="884" y="989" class="small muted">Note (optional)</text>
  <rect x="884" y="998" width="305" height="34" rx="4" class="border"/>
  <text x="898" y="1021" class="small muted">Add a note</text>
  <rect x="1204" y="998" width="110" height="34" rx="4" class="button"/>
  <text x="1259" y="1021" text-anchor="middle" class="small label">Save</text>

  <text x="80" y="1114" class="small muted">Low-fidelity concept only — example records and controls are illustrative. Pagination is not shown.</text>
</svg>
